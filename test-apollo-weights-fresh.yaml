apiVersion: v1
kind: Pod
metadata:
  name: test-apollo-weights-fresh
  namespace: default
  labels:
    app.kubernetes.io/component: training
  annotations:
    apollo.ai-storage/workload-type: training
    apollo.ai-storage/io-pattern: read_heavy
    apollo.ai-storage/requires-gpu: "true"
    apollo.ai-storage/data-locations: "gpu-server-03"
spec:
  schedulerName: ai-storage-scheduler
  containers:
  - name: test
    image: busybox
    command: ["sleep", "30"]
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
  restartPolicy: Never
