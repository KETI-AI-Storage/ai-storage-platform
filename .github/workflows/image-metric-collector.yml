name: image-metric-collector

# Build the metric-collector image, push to GHCR, and bump the GitOps tag.
# ArgoCD (on the cluster) then syncs deploy/metric-collector and deploys it.

on:
  push:
    branches: [cicd-automation]
    paths:
      - 'ai-storage-metric-collector/**'
      - '.github/workflows/image-metric-collector.yml'

permissions:
  contents: write   # to commit the bumped image tag back

concurrency:
  group: image-metric-collector
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          set -euo pipefail
          IMG=ketidevit2/ai-storage-metric-collector
          SHA=${GITHUB_SHA::7}
          docker build -f ai-storage-metric-collector/build/Dockerfile \
            -t "$IMG:$SHA" -t "$IMG:latest" ai-storage-metric-collector
          docker push "$IMG:$SHA"
          docker push "$IMG:latest"

      - name: Bump GitOps image tag
        run: |
          set -euo pipefail
          SHA=${GITHUB_SHA::7}
          sed -i "s|newTag:.*|newTag: $SHA|" deploy/metric-collector/kustomization.yaml
          git config user.name jja147
          git config user.email eci0584@gmail.com
          git add deploy/metric-collector/kustomization.yaml
          git commit -m "deploy(metric-collector): image $SHA [skip ci]" || { echo "no tag change"; exit 0; }
          git push
