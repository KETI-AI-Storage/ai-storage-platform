name: image

# Unified image build. Replaces the per-component image-*.yml workflows.
# `detect` diffs the push and maps changed paths to components via
# deploy/*/appconfig.json (sourceDir); `build` then builds ONLY the changed
# components as a matrix. To onboard a new component, add deploy/<name>/ with an
# appconfig.json — no edit to this workflow is needed.

on:
  push:
    branches: [cicd-automation, cicd-82]

permissions:
  contents: write   # to commit the bumped image tag back

jobs:
  detect:
    runs-on: self-hosted
    outputs:
      components: ${{ steps.d.outputs.components }}
      any: ${{ steps.d.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need the previous commit to diff against
      - id: d
        name: Detect changed components
        run: |
          set -euo pipefail
          BASE=${{ github.event.before }}
          git cat-file -e "$BASE" 2>/dev/null || BASE=$(git rev-parse HEAD~1)
          git diff --name-only "$BASE" ${{ github.sha }} > /tmp/changed.txt
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, glob
          changed = [l.strip() for l in open('/tmp/changed.txt') if l.strip()]
          sel = []
          for cfg in sorted(glob.glob('deploy/*/appconfig.json')):
              c = json.load(open(cfg))
              src = (c.get('sourceDir') or '').rstrip('/')
              if not src:
                  continue  # deploy-only workload (prebuilt/public image) — nothing to build
              if any(p == src or p.startswith(src + '/') for p in changed):
                  sel.append(c)
          print('any=' + ('true' if sel else 'false'))
          print('components=' + json.dumps(sel))
          PY

  build:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.detect.outputs.components) }}
    concurrency:
      group: image-${{ matrix.component.name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          set -euo pipefail
          IMG=${{ matrix.component.image }}
          SHA=${GITHUB_SHA::7}
          docker build -f ${{ matrix.component.dockerfile }} \
            -t "$IMG:$SHA" -t "$IMG:latest" ${{ matrix.component.sourceDir }}
          docker push "$IMG:$SHA"
          docker push "$IMG:latest"

      - name: Bump GitOps image tag
        run: |
          set -euo pipefail
          SHA=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF_NAME}
          KUST=${{ matrix.component.deployDir }}/kustomization.yaml
          git config user.name jja147
          git config user.email eci0584@gmail.com
          # Builds take minutes and sibling matrix legs push concurrently. Re-fetch
          # the branch tip, re-apply the one-line bump, and retry the push so a
          # non-fast-forward never fails the run. reset+push HEAD:$BRANCH also works
          # from checkout's detached HEAD (where `git pull --rebase` has no upstream).
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            # quote the tag: an all-digit short SHA would otherwise parse as a YAML number
            sed -i "s|newTag:.*|newTag: \"$SHA\"|" "$KUST"
            if git diff --quiet -- "$KUST"; then
              echo "tag already at $SHA, nothing to push"; exit 0
            fi
            git add "$KUST"
            git commit -q -m "deploy(${{ matrix.component.name }}): image $SHA [skip ci]"
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed tag bump $SHA (attempt $attempt)"; exit 0
            fi
            echo "push rejected (attempt $attempt) — refetching and retrying"
            sleep 3
          done
          echo "ERROR: could not push tag bump after 5 attempts"; exit 1
