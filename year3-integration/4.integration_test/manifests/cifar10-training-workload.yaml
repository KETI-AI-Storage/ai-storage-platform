# cifar10-training-workload.yaml
# CIFAR-10 전처리 결과를 사용한 GPU 학습 Job과 checkpoint PVC 정의.
#
# Author: 미정 <unknown@example.com>
# Created: 2026-05-27
#
# storageClassName은 의도적으로 비워 둔다. ai-storage webhook이 PVC annotation을 보고 주입한다.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-storage-workloads
  labels:
    keti-ai-storage-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cifar10-workload
  namespace: ai-storage-workloads
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cifar10-workload-pod-reader
  namespace: ai-storage-workloads
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cifar10-workload-pod-reader
  namespace: ai-storage-workloads
subjects:
  - kind: ServiceAccount
    name: cifar10-workload
    namespace: ai-storage-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cifar10-workload-pod-reader
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cifar10-preprocessing-pvc
  namespace: ai-storage-workloads
  annotations:
    storage.keti.io/workload-type: preprocessing
    storage.keti.io/data-role: preprocessing-input
    storage.keti.io/priority: high
    storage.keti.io/io-pattern: large-read
    storage.keti.io/latency: low
  labels:
    app: cifar10-training-workload
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cifar10-checkpoint-pvc
  namespace: ai-storage-workloads
  annotations:
    storage.keti.io/workload-type: training
    storage.keti.io/data-role: intermediate
    storage.keti.io/priority: medium
    storage.keti.io/io-pattern: large-write
  labels:
    app: cifar10-training-workload
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cifar10-result-log-pvc
  namespace: ai-storage-workloads
  annotations:
    storage.keti.io/workload-type: archive
    storage.keti.io/data-role: result-backup
    storage.keti.io/priority: low
  labels:
    app: cifar10-training-workload
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cifar10-training-workload
  namespace: ai-storage-workloads
  labels:
    app: cifar10-training-workload
    workload.keti.io/type: training
    workload.keti.io/framework: pytorch
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: cifar10-training-workload
        workload.keti.io/type: training
        workload.keti.io/framework: pytorch
      annotations:
        mlops.keti.io/main-container: training
    spec:
      serviceAccountName: cifar10-workload
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: gpu-server-03
      containers:
        - name: training
          image: pytorch/pytorch:2.3.1-cuda12.1-cudnn8-runtime
          imagePullPolicy: IfNotPresent
          command: ["bash", "-lc"]
          args:
            - |
              python3 -u /opt/workloads/cifar10_train.py
          env:
            - name: EPOCHS
              value: "2"
            - name: MAX_TRAIN_SAMPLES
              value: "10000"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "8Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workload-scripts
              mountPath: /opt/workloads
            - name: preprocessed
              mountPath: /data/preprocessed
            - name: checkpoints
              mountPath: /data/checkpoints
            - name: result-log
              mountPath: /data/logs
      volumes:
        - name: workload-scripts
          configMap:
            name: cifar10-train-script
        - name: preprocessed
          persistentVolumeClaim:
            claimName: cifar10-preprocessing-pvc
        - name: checkpoints
          persistentVolumeClaim:
            claimName: cifar10-checkpoint-pvc
        - name: result-log
          persistentVolumeClaim:
            claimName: cifar10-result-log-pvc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cifar10-train-script
  namespace: ai-storage-workloads
data:
  cifar10_train.py: |
    from __future__ import annotations
    import json, os, time
    from pathlib import Path
    import torch
    from torch import nn
    from torch.utils.data import DataLoader, TensorDataset

    class SmallCifarCnn(nn.Module):
        def __init__(self):
            super().__init__()
            self.features = nn.Sequential(
                nn.Conv2d(3, 32, 3, padding=1), nn.ReLU(), nn.MaxPool2d(2),
                nn.Conv2d(32, 64, 3, padding=1), nn.ReLU(), nn.MaxPool2d(2),
                nn.Conv2d(64, 128, 3, padding=1), nn.ReLU(), nn.AdaptiveAvgPool2d((1, 1)),
            )
            self.classifier = nn.Linear(128, 10)
        def forward(self, x):
            return self.classifier(torch.flatten(self.features(x), 1))

    preprocessed_dir = Path(os.getenv("PREPROCESSED_DIR", "/data/preprocessed"))
    checkpoint_dir = Path(os.getenv("CHECKPOINT_DIR", "/data/checkpoints"))
    log_dir = Path(os.getenv("LOG_DIR", "/data/logs"))
    checkpoint_dir.mkdir(parents=True, exist_ok=True)
    log_dir.mkdir(parents=True, exist_ok=True)
    train_path = preprocessed_dir / "train.pt"
    if not train_path.exists():
        raise FileNotFoundError(f"전처리 결과가 없습니다: {train_path}")
    started = time.perf_counter()
    payload = torch.load(train_path, map_location="cpu")
    max_samples = int(os.getenv("MAX_TRAIN_SAMPLES", "10000"))
    images, labels = payload["images"][:max_samples], payload["labels"][:max_samples]
    loader = DataLoader(TensorDataset(images, labels), batch_size=int(os.getenv("BATCH_SIZE", "128")), shuffle=True)
    device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
    model = SmallCifarCnn().to(device)
    optimizer = torch.optim.Adam(model.parameters(), lr=float(os.getenv("LEARNING_RATE", "0.001")))
    criterion = nn.CrossEntropyLoss()
    history = []
    for epoch in range(1, int(os.getenv("EPOCHS", "2")) + 1):
        total_loss = total_correct = total_seen = 0
        model.train()
        for batch_images, batch_labels in loader:
            batch_images, batch_labels = batch_images.to(device), batch_labels.to(device)
            optimizer.zero_grad(set_to_none=True)
            logits = model(batch_images)
            loss = criterion(logits, batch_labels)
            loss.backward()
            optimizer.step()
            seen = int(batch_labels.numel())
            total_loss += float(loss.item()) * seen
            total_correct += int((logits.argmax(1) == batch_labels).sum().item())
            total_seen += seen
        item = {"epoch": epoch, "loss": round(total_loss / total_seen, 6), "accuracy": round(total_correct / total_seen, 6)}
        history.append(item)
        print(json.dumps(item), flush=True)
    checkpoint_path = checkpoint_dir / "cifar10_model.pt"
    torch.save({"model_state_dict": model.state_dict(), "classes": payload.get("classes"), "history": history}, checkpoint_path)
    summary = {
        "status": "completed",
        "device": str(device),
        "checkpoint_path": str(checkpoint_path),
        "samples": int(labels.numel()),
        "history": history,
        "elapsed_seconds": round(time.perf_counter() - started, 3),
    }
    (log_dir / "train_summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
    print(json.dumps(summary, indent=2), flush=True)
