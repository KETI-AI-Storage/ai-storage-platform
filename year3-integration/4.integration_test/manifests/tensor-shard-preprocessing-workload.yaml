# tensor-shard-preprocessing-workload.yaml
# 대용량 전처리 tensor를 shard 파일로 분할 저장하는 Job.
#
# Author: 미정 <unknown@example.com>
# Created: 2026-05-28
#
# 설계 의도:
# - 입력 PVC(/data/preprocessed)는 train.pt를 large-read → L2 기대.
# - shard 출력 PVC(/data/shards)는 학습 분산 로딩용 intermediate large-write → L3 기대.
# - 로그 PVC(/data/logs)는 archive 성격 → S3 기대.
# - storageClassName은 의도적으로 비워 둔다. ai-storage webhook이 PVC annotation을 보고 주입한다.
# - schedulerName / insight-trace sidecar / shareProcessNamespace는 webhook이 주입한다.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-storage-workloads
  labels:
    keti-ai-storage-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tensor-shard-workload
  namespace: ai-storage-workloads
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tensor-shard-workload-pod-reader
  namespace: ai-storage-workloads
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tensor-shard-workload-pod-reader
  namespace: ai-storage-workloads
subjects:
  - kind: ServiceAccount
    name: tensor-shard-workload
    namespace: ai-storage-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tensor-shard-workload-pod-reader
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tensor-shard-input-pvc
  namespace: ai-storage-workloads
  annotations:
    storage.keti.io/workload-type: preprocessing
    storage.keti.io/data-role: preprocessing-input
    storage.keti.io/priority: high
    storage.keti.io/io-pattern: large-read
    storage.keti.io/latency: low
  labels:
    app: tensor-shard-preprocessing-workload
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tensor-shard-output-pvc
  namespace: ai-storage-workloads
  annotations:
    storage.keti.io/workload-type: preprocessing
    storage.keti.io/data-role: intermediate
    storage.keti.io/priority: medium
    storage.keti.io/io-pattern: large-write
  labels:
    app: tensor-shard-preprocessing-workload
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tensor-shard-result-log-pvc
  namespace: ai-storage-workloads
  annotations:
    storage.keti.io/workload-type: archive
    storage.keti.io/data-role: result-backup
    storage.keti.io/priority: low
  labels:
    app: tensor-shard-preprocessing-workload
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tensor-shard-preprocessing-workload
  namespace: ai-storage-workloads
  labels:
    app: tensor-shard-preprocessing-workload
    workload.keti.io/type: preprocessing
    workload.keti.io/stage: sharding
    workload.keti.io/framework: pytorch
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: tensor-shard-preprocessing-workload
        workload.keti.io/type: preprocessing
        workload.keti.io/stage: sharding
        workload.keti.io/framework: pytorch
      annotations:
        mlops.keti.io/main-container: shard
        insight-trace.keti.io/main-container: shard
    spec:
      serviceAccountName: tensor-shard-workload
      restartPolicy: Never
      containers:
        - name: shard
          image: pytorch/pytorch:2.3.1-cuda12.1-cudnn8-runtime
          imagePullPolicy: IfNotPresent
          command: ["bash", "-lc"]
          args:
            - |
              python3 -u /opt/workloads/tensor_shard_preprocess.py
          env:
            - name: INPUT_PATH
              value: /data/preprocessed/train.pt
            - name: SHARDS_DIR
              value: /data/shards
            - name: LOG_DIR
              value: /data/logs
            - name: NUM_SHARDS
              value: "16"
            - name: FALLBACK_SAMPLES
              value: "4096"
            - name: FALLBACK_FEATURE_DIM
              value: "256"
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "6Gi"
          volumeMounts:
            - name: workload-scripts
              mountPath: /opt/workloads
            - name: preprocessed
              mountPath: /data/preprocessed
            - name: shards
              mountPath: /data/shards
            - name: result-log
              mountPath: /data/logs
      volumes:
        - name: workload-scripts
          configMap:
            name: tensor-shard-preprocess-script
        - name: preprocessed
          persistentVolumeClaim:
            claimName: tensor-shard-input-pvc
        - name: shards
          persistentVolumeClaim:
            claimName: tensor-shard-output-pvc
        - name: result-log
          persistentVolumeClaim:
            claimName: tensor-shard-result-log-pvc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tensor-shard-preprocess-script
  namespace: ai-storage-workloads
data:
  tensor_shard_preprocess.py: |
    """tensor shard 분할 entrypoint (ConfigMap 임베드 버전)."""
    from __future__ import annotations
    import json, os, time
    from pathlib import Path
    import torch

    input_path = Path(os.getenv("INPUT_PATH", "/data/preprocessed/train.pt"))
    shards_dir = Path(os.getenv("SHARDS_DIR", "/data/shards"))
    log_dir = Path(os.getenv("LOG_DIR", "/data/logs"))
    num_shards = max(1, int(os.getenv("NUM_SHARDS", "16")))
    fallback_samples = int(os.getenv("FALLBACK_SAMPLES", "4096"))
    fallback_feature_dim = int(os.getenv("FALLBACK_FEATURE_DIM", "256"))
    for p in (shards_dir, log_dir):
        p.mkdir(parents=True, exist_ok=True)

    started = time.perf_counter()
    input_existed = input_path.exists()
    if input_existed:
        payload = torch.load(input_path, map_location="cpu")
    else:
        payload = {
            "features": torch.randn(fallback_samples, fallback_feature_dim),
            "labels": torch.randint(0, 10, (fallback_samples,), dtype=torch.long),
            "classes": [f"class_{i}" for i in range(10)],
        }

    if "features" in payload:
        features = payload["features"]
    elif "images" in payload:
        features = payload["images"]
    else:
        raise KeyError("payload must contain 'features' or 'images'")
    labels = payload.get("labels", torch.zeros(features.shape[0], dtype=torch.long))
    classes = payload.get("classes", [])

    total_samples = int(features.shape[0])
    base_shard_size = total_samples // num_shards
    remainder = total_samples - base_shard_size * num_shards

    shard_records = []
    cursor = 0
    for shard_index in range(num_shards):
        extra = 1 if shard_index < remainder else 0
        size = base_shard_size + extra
        if size == 0:
            break
        slice_features = features[cursor : cursor + size]
        slice_labels = labels[cursor : cursor + size]
        cursor += size
        shard_path = shards_dir / f"shard-{shard_index:03d}.pt"
        torch.save({
            "features": slice_features,
            "labels": slice_labels,
            "shard_index": shard_index,
            "num_shards": num_shards,
        }, shard_path)
        shard_records.append({
            "index": shard_index,
            "path": str(shard_path),
            "samples": int(slice_features.shape[0]),
            "shape": list(slice_features.shape),
            "bytes": int(slice_features.element_size() * slice_features.numel()),
        })
        print(f"shard {shard_index} saved samples={slice_features.shape[0]} shape={list(slice_features.shape)}", flush=True)

    summary = {
        "status": "completed",
        "input_path": str(input_path),
        "input_existed": input_existed,
        "shards_dir": str(shards_dir),
        "num_shards_requested": num_shards,
        "num_shards_written": len(shard_records),
        "total_samples": total_samples,
        "classes_known": len(classes),
        "shards": shard_records,
        "torch_version": torch.__version__,
        "elapsed_seconds": round(time.perf_counter() - started, 3),
    }
    (log_dir / "tensor_shard_summary.json").write_text(json.dumps(summary, indent=2, ensure_ascii=False), encoding="utf-8")
    print(json.dumps(summary, indent=2, ensure_ascii=False), flush=True)
