# Preemption 데모 전용 PriorityClass + 후보 Pod.
#
# 목적: ai-storage-orchestrator/pkg/controller/preemption.go:329 의
#       "PriorityValue >= MinPriority 이면 후보 제외" 규칙을 통과시키기 위해
#       priority 가 0 미만(=demo-low-priority)인 evict 대상 Pod 1 개를
#       시연 워크로드의 같은 노드(gpu-server-03 가정) 에 미리 띄운다.
#
# 사용:
#   # 1) PriorityClass + Pod 생성
#   kubectl apply -f 02-preemption-priorityclass-and-pod.yaml
#   # 2) Pod 이 원하는 노드에 떨어지지 않으면 DEMO_PARAM_TARGET_NODE 에 맞춰 nodeName 수정.
#
# Author: 미정
# Created: 2026-05-26
# Related: ai-storage-orchestrator/pkg/controller/preemption.go (findPreemptionCandidates)
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: demo-low-priority
  labels:
    demo.keti.io/component: preemption
value: -100
globalDefault: false
description: "데모용: preemption 정책의 후보가 되도록 의도적으로 음수 priority 부여"
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-preemption-victim
  namespace: ope-model-verify
  labels:
    demo.keti.io/component: preemption
    demo.keti.io/role: evict-target
spec:
  priorityClassName: demo-low-priority
  # WARNING: nodeName 은 시연 워크로드가 떠 있는 노드와 동일해야 한다.
  #          시연 환경에 맞춰 gpu-server-03 외의 노드라면 이 값을 변경한다.
  nodeName: gpu-server-03
  terminationGracePeriodSeconds: 0
  containers:
    - name: idle
      image: busybox:1.36
      command: ["sh", "-c", "while true; do sleep 30; done"]
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
