# ai-storage-workloads-namespace.yaml
# AI Storage 실제 워크로드용 Namespace 정의.
#
# Author: 미정 <unknown@example.com>
# Created: 2026-05-28
#
# 설계 의도:
# - 실 운영 워크로드(전처리/학습/추론)는 이 Namespace에 배치한다.
# - keti-ai-storage-injection=enabled 라벨이 있을 때만 ai-storage webhook이
#   schedulerName / shareProcessNamespace / insight-trace sidecar / PVC tier 주입을 수행한다.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-storage-workloads
  labels:
    keti-ai-storage-injection: enabled
