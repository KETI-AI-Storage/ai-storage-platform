apiVersion: v1
kind: Pod
metadata:
  name: etri-train
  namespace: default
  labels:
    etri/workload_type: train
  annotations:
    etri/dataset_name: demo-dataset
    etri/dataset_id: ds-demo
    etri/logical_path: /datasets/demo
    etri/access_pattern: read
    etri/cache: "true"
    etri/local_first: "true"
    etri/data_locality: high
spec:
  containers:
    - name: trainer
      image: alpine
      command: ["sh", "-c", "sleep 3600"]
