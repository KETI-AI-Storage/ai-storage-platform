# cifar10-preprocessing-workload.yaml
# CIFAR-10 실제 데이터 전처리 Job과 tier 선택 검증용 PVC 정의.
#
# Author: 미정 <unknown@example.com>
# Created: 2026-05-27
#
# storageClassName은 의도적으로 비워 둔다. ai-storage webhook이 PVC annotation을 보고 주입한다.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-storage-workloads
  labels:
    keti-ai-storage-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cifar10-workload
  namespace: ai-storage-workloads
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cifar10-workload-pod-reader
  namespace: ai-storage-workloads
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cifar10-workload-pod-reader
  namespace: ai-storage-workloads
subjects:
  - kind: ServiceAccount
    name: cifar10-workload
    namespace: ai-storage-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cifar10-workload-pod-reader
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cifar10-raw-dataset-pvc
  namespace: ai-storage-workloads
  annotations:
    storage.keti.io/workload-type: dataset-ingest
    storage.keti.io/data-role: raw-dataset
    storage.keti.io/priority: medium
    storage.keti.io/io-pattern: large-read
  labels:
    app: cifar10-preprocessing-workload
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cifar10-preprocessing-pvc
  namespace: ai-storage-workloads
  annotations:
    storage.keti.io/workload-type: preprocessing
    storage.keti.io/data-role: preprocessing-input
    storage.keti.io/priority: high
    storage.keti.io/io-pattern: large-read
    storage.keti.io/latency: low
  labels:
    app: cifar10-preprocessing-workload
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cifar10-cache-pvc
  namespace: ai-storage-workloads
  annotations:
    storage.keti.io/workload-type: preprocessing
    storage.keti.io/data-role: cache
    storage.keti.io/access-pattern: repeated
    storage.keti.io/latency: ultra-low
  labels:
    app: cifar10-preprocessing-workload
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cifar10-result-log-pvc
  namespace: ai-storage-workloads
  annotations:
    storage.keti.io/workload-type: archive
    storage.keti.io/data-role: result-backup
    storage.keti.io/priority: low
  labels:
    app: cifar10-preprocessing-workload
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cifar10-preprocessing-workload
  namespace: ai-storage-workloads
  labels:
    app: cifar10-preprocessing-workload
    workload.keti.io/type: preprocessing
    workload.keti.io/framework: pytorch
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: cifar10-preprocessing-workload
        workload.keti.io/type: preprocessing
        workload.keti.io/framework: pytorch
      annotations:
        mlops.keti.io/main-container: preprocess
    spec:
      serviceAccountName: cifar10-workload
      restartPolicy: Never
      containers:
        - name: preprocess
          image: pytorch/pytorch:2.3.1-cuda12.1-cudnn8-runtime
          imagePullPolicy: IfNotPresent
          command: ["bash", "-lc"]
          args:
            - |
              python3 -u /opt/workloads/cifar10_preprocess.py
          env:
            - name: CIFAR10_DOWNLOAD
              value: "true"
            - name: MAX_TRAIN_SAMPLES
              value: "50000"
            - name: MAX_TEST_SAMPLES
              value: "10000"
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "6Gi"
          volumeMounts:
            - name: workload-scripts
              mountPath: /opt/workloads
            - name: raw-dataset
              mountPath: /data/raw
            - name: preprocessed
              mountPath: /data/preprocessed
            - name: cache
              mountPath: /data/cache
            - name: result-log
              mountPath: /data/logs
      volumes:
        - name: workload-scripts
          configMap:
            name: cifar10-preprocess-script
        - name: raw-dataset
          persistentVolumeClaim:
            claimName: cifar10-raw-dataset-pvc
        - name: preprocessed
          persistentVolumeClaim:
            claimName: cifar10-preprocessing-pvc
        - name: cache
          persistentVolumeClaim:
            claimName: cifar10-cache-pvc
        - name: result-log
          persistentVolumeClaim:
            claimName: cifar10-result-log-pvc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cifar10-preprocess-script
  namespace: ai-storage-workloads
data:
  cifar10_preprocess.py: |
    from __future__ import annotations
    import json, os, time
    from pathlib import Path
    import torch
    from torch.utils.data import Subset
    from torchvision import datasets, transforms

    def flag(value: str) -> bool:
        return value.lower() in {"1", "true", "yes", "y", "on"}

    def dump_dataset(dataset, max_samples: int):
        subset = Subset(dataset, range(min(len(dataset), max_samples)))
        images, labels = [], []
        for image, label in subset:
            images.append(image)
            labels.append(label)
        return {"images": torch.stack(images), "labels": torch.tensor(labels), "classes": dataset.classes}

    raw_dir = Path(os.getenv("RAW_DIR", "/data/raw"))
    output_dir = Path(os.getenv("PREPROCESSED_DIR", "/data/preprocessed"))
    cache_dir = Path(os.getenv("CACHE_DIR", "/data/cache"))
    log_dir = Path(os.getenv("LOG_DIR", "/data/logs"))
    for path in (raw_dir, output_dir, cache_dir, log_dir):
        path.mkdir(parents=True, exist_ok=True)

    started = time.perf_counter()
    transform = transforms.Compose([
        transforms.Resize((int(os.getenv("IMAGE_SIZE", "32")), int(os.getenv("IMAGE_SIZE", "32")))),
        transforms.ToTensor(),
        transforms.Normalize((0.4914, 0.4822, 0.4465), (0.2470, 0.2435, 0.2616)),
    ])
    download = flag(os.getenv("CIFAR10_DOWNLOAD", "true"))
    train = datasets.CIFAR10(str(raw_dir), train=True, download=download, transform=transform)
    test = datasets.CIFAR10(str(raw_dir), train=False, download=download, transform=transform)
    train_payload = dump_dataset(train, int(os.getenv("MAX_TRAIN_SAMPLES", "50000")))
    test_payload = dump_dataset(test, int(os.getenv("MAX_TEST_SAMPLES", "10000")))
    torch.save(train_payload, output_dir / "train.pt")
    torch.save(test_payload, output_dir / "test.pt")
    summary = {
        "status": "completed",
        "download": download,
        "train_path": str(output_dir / "train.pt"),
        "test_path": str(output_dir / "test.pt"),
        "train_samples": int(train_payload["labels"].numel()),
        "test_samples": int(test_payload["labels"].numel()),
        "elapsed_seconds": round(time.perf_counter() - started, 3),
    }
    (log_dir / "preprocess_summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
    print(json.dumps(summary, indent=2), flush=True)
