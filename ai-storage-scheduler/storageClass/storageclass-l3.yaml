# Gluesys L3 (HDD / Capacity) tier StorageClass.
# 용도: 원본 대용량 데이터, 중간 산출물, warm/cold data.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: storage-l3
  labels:
    storage.keti.io/tier: L3
    storage.keti.io/tier-role: hdd-capacity
    storage.keti.io/gluesys-tier: "true"
provisioner: cluster.local/nfs-subdir-external-provisioner
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
parameters:
  tier: L3
  tierRole: hdd-capacity
  dataClass: warm-cold
