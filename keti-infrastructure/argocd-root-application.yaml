      selfHeal: true

---
# 4. Insight-Trace (Sidecar Injector)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keti-insight-trace
  namespace: argocd
  labels:
    project: keti-ai-storage
    component: insight-trace
spec:
  project: default
  source:
    repoURL: https://github.com/KETI-AI-Storage/keti-platform.git
    targetRevision: main
    path: insight-trace/deployments
  destination:
    server: https://kubernetes.default.svc
    namespace: keti
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
