# =============================================================================
# ai-storage-webhook PVC tier 주입 검증용 sanity PVC.
#
# 목적:
#   - MutatingWebhookConfiguration 의 PVC webhook 이 default ns 에서 동작하는지 확인
#   - storage.keti.io/* annotation 기반 AHP score rule 이 L2 로 수렴하는지 확인
#
# 기대 동작 (webhook 정상 호출 시):
#   spec.storageClassName                    : storage-l2
#   metadata.annotations.ai-storage/selected-tier         : L2
#   metadata.annotations.ai-storage/selected-storage-class: storage-l2
#   metadata.annotations.ai-storage/tier-reason           : selection-path=score-rule;
#                                                            selected=L2; ...
#
# Score 계산(코드 기준 scoreRuleSelect):
#   data-role=preprocessing-input -> L2 +50
#   workload-type=preprocessing   -> L2 +25
#   latency=low                   -> L2 +25
#   priority=high                 -> L1 +5,  L2 +10
#   io-pattern=large-read         -> L2 +15, L3 +10
#   => L1=5  L2=125  L3=10  S3=0  -> L2 선택
#
# 주의:
#   - default ns 에서 동작하려면 webhook-config.yaml 의 PVC webhook 이
#     시스템 ns 외의 모든 ns 를 허용해야 한다(이번 변경 사항).
#   - spec.storageClassName 을 빈 문자열 "" 로 두면 default SC 가 먼저 붙기 전에
#     webhook 의 add 패치가 적용되는 경로를 검증할 수 있다.
#     (만약 cluster default SC=nfs-client 가 먼저 붙으면 webhook 이
#      AI_STORAGE_REPLACEABLE_STORAGE_CLASSES=nfs-client 설정으로 replace 한다)
#
# Author: 미정 <unknown@keti.io>
# Created: 미정
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-webhook-l2-test
  namespace: default
  annotations:
    storage.keti.io/workload-type: "preprocessing"
    storage.keti.io/data-role: "preprocessing-input"
    storage.keti.io/priority: "high"
    storage.keti.io/io-pattern: "large-read"
    storage.keti.io/latency: "low"
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
