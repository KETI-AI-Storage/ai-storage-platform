# =============================================================================
# AI Storage Webhook - Deployment + Service
#
# Deployment: 웹훅 서버 Pod 배포
# Service: K8s API Server가 웹훅을 호출하기 위한 ClusterIP 서비스
#
# API Server → Service (443) → Pod (8443)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-storage-webhook
  namespace: keti
  labels:
    app: ai-storage-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-storage-webhook
  template:
    metadata:
      labels:
        app: ai-storage-webhook
        # 이 Pod 자체는 웹훅 주입 대상에서 제외
        keti-ai-storage-injection: disabled
    spec:
      serviceAccountName: ai-storage-webhook
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - operator: Exists
      containers:
      - name: webhook
        image: ketidevit2/ai-storage-webhook:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8443
          name: https
        # ─────────────────────────────────────────────
        # 환경변수로 웹훅 설정
        # Dockerfile의 ENTRYPOINT에서 플래그 대신 사용 가능
        # ─────────────────────────────────────────────
        env:
        - name: SCHEDULER_NAME
          value: "ai-storage-scheduler"
        - name: SIDECAR_IMAGE
          value: "ketidevit2/insight-trace:job-exit-20260527"
        - name: APOLLO_ENDPOINT
          value: "apollo-policy-server.keti.svc.cluster.local:50051"
        # DefaultStorageClass가 웹훅보다 먼저 nfs-client를 붙이는 경우, 티어 SC로 교체 허용
        - name: AI_STORAGE_REPLACEABLE_STORAGE_CLASSES
          value: "nfs-client"
        # ─────────────────────────────────────────────
        # TLS 인증서 볼륨 마운트
        # Secret에서 tls.crt, tls.key를 /certs로 마운트
        # ─────────────────────────────────────────────
        volumeMounts:
        - name: tls-certs
          mountPath: /certs
          readOnly: true
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        # ─────────────────────────────────────────────
        # 헬스체크
        # /healthz 엔드포인트로 서버 상태 확인
        # ─────────────────────────────────────────────
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: tls-certs
        secret:
          secretName: ai-storage-webhook-tls
---
# =============================================================================
# Service: API Server → 웹훅 Pod 연결
#
# MutatingWebhookConfiguration에서 이 Service를 참조.
# API Server가 443으로 요청 → Service가 8443으로 전달.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: ai-storage-webhook
  namespace: keti
spec:
  selector:
    app: ai-storage-webhook
  ports:
  - port: 443
    targetPort: 8443
    protocol: TCP
---
# =============================================================================
# ServiceAccount + RBAC
#
# 웹훅 자체는 특별한 K8s 권한이 필요 없음.
# (API Server가 AdmissionReview를 보내고, 웹훅은 응답만 하면 됨)
# ServiceAccount만 생성.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-storage-webhook
  namespace: keti

---
# =============================================================================
# RBAC: webhook pod needs to read PVCs so that Pod mutation logs can include
# referenced PVC storageClassName/tier.
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-storage-webhook-pvc-reader
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-storage-webhook-pvc-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-storage-webhook-pvc-reader
subjects:
  - kind: ServiceAccount
    name: ai-storage-webhook
    namespace: keti
