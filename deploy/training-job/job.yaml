apiVersion: batch/v1
kind: Job
metadata:
  name: training-job
  namespace: ai-storage-workloads
  labels:
    # Routes this Job through Kueue. The GPU request below forces gpu-flavor
    # admission in ClusterQueue ai-storage-cluster-queue (LocalQueue ai-storage-queue).
    kueue.x-k8s.io/queue-name: demo-admission-queue
  annotations:
    # A Job's spec.selector/spec.template are immutable, so Replace=true alone
    # (kubectl replace) fails. Force=true makes ArgoCD run `kubectl replace --force`
    # = delete + recreate, so each new image (new commit) re-runs the training.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app: training-job
    spec:
      nodeSelector:
        keti.io/demo-hold: "true"
      restartPolicy: Never
      # No nodeSelector needed: the nvidia.com/gpu resource request below only
      # schedules onto a node advertising GPUs (gpu-server-03), via the device plugin.
      containers:
        - name: train
          image: training-job            # registry+tag set by kustomize (CI bumps)
          imagePullPolicy: IfNotPresent
          env:
            - {name: EPOCHS, value: "10"}
            - {name: BATCH_SIZE, value: "256"}
            - {name: OUTPUT_DIR, value: /data}
          resources:
            requests: {cpu: "4", memory: 8Gi}
            limits: {cpu: "8", memory: 16Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: training-job-data
