apiVersion: batch/v1
kind: Job
metadata:
  name: training-job
  namespace: ai-storage-workloads
  annotations:
    # A Job is immutable, so ArgoCD must delete+recreate it (not patch) when the
    # image changes. Replace=true makes each new image (new commit) re-run training.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app: training-job
    spec:
      restartPolicy: Never
      containers:
        - name: train
          # registry + tag are set by kustomize (CI bumps the tag per build)
          image: training-job
          imagePullPolicy: IfNotPresent
          env:
            - name: EPOCHS
              value: "20"
            - name: LR
              value: "0.1"
