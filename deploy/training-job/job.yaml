apiVersion: batch/v1
kind: Job
metadata:
  name: training-job
  namespace: ai-storage-workloads
  annotations:
    # A Job is immutable; Replace=true makes ArgoCD delete+recreate it so a new
    # image (new commit) re-runs the training.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app: training-job
    spec:
      restartPolicy: Never
      # No nodeSelector needed: the nvidia.com/gpu resource request below only
      # schedules onto a node advertising GPUs (gpu-server-03), via the device plugin.
      containers:
        - name: train
          image: training-job            # registry+tag set by kustomize (CI bumps)
          imagePullPolicy: IfNotPresent
          env:
            - {name: EPOCHS, value: "10"}
            - {name: BATCH_SIZE, value: "256"}
            - {name: OUTPUT_DIR, value: /data}
          resources:
            requests: {cpu: "4", memory: 8Gi}
            limits: {cpu: "8", memory: 16Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: training-job-data
