apiVersion: v1
kind: ServiceAccount
metadata:
  name: unified-pipeline-runner
  namespace: ai-storage-workloads
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unified-pipeline-runner
  namespace: ai-storage-workloads
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unified-pipeline-runner
  namespace: ai-storage-workloads
subjects:
  - kind: ServiceAccount
    name: unified-pipeline-runner
    namespace: ai-storage-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: unified-pipeline-runner
