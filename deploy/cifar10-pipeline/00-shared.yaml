# Shared resources for the cifar10 pipeline.
# Namespace omitted on purpose: the ApplicationSet syncs with CreateNamespace=true,
# and we don't want ArgoCD to own/prune the shared ai-storage-workloads namespace.
#
# IMPORTANT — sync-wave + WaitForFirstConsumer:
# The tier StorageClasses bind WaitForFirstConsumer, so a PVC stays Pending until a
# consumer pod exists. ArgoCD sync-waves wait for each wave to be Healthy (PVC=Bound)
# before the next. So each PVC is placed in the SAME wave as its FIRST consumer Job,
# so that Job's pod triggers the bind and the wave goes Healthy (no deadlock).
#   wave 0: SA + RBAC (bind-independent, instantly healthy)
#   wave 1: raw / preprocessing / cache / result-log PVCs (first consumed by preprocess)
#   wave 2: checkpoint PVC (first consumed by train)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cifar10-workload
  namespace: ai-storage-workloads
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cifar10-workload-pod-reader
  namespace: ai-storage-workloads
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cifar10-workload-pod-reader
  namespace: ai-storage-workloads
subjects:
  - kind: ServiceAccount
    name: cifar10-workload
    namespace: ai-storage-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cifar10-workload-pod-reader
---
# PVCs: storageClassName intentionally empty -> the ai-storage webhook injects the
# StorageClass tier from the storage.keti.io/* hints. sync-wave aligns each PVC with
# its first-consumer Job (see header) so WaitForFirstConsumer can bind.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cifar10-raw-dataset-pvc
  namespace: ai-storage-workloads
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    storage.keti.io/workload-type: dataset-ingest
    storage.keti.io/data-role: raw-dataset
    storage.keti.io/priority: medium
    storage.keti.io/io-pattern: large-read
spec:
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cifar10-preprocessing-pvc
  namespace: ai-storage-workloads
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    storage.keti.io/workload-type: preprocessing
    storage.keti.io/data-role: preprocessing-input
    storage.keti.io/priority: high
    storage.keti.io/io-pattern: large-read
    storage.keti.io/latency: low
spec:
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 4Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cifar10-cache-pvc
  namespace: ai-storage-workloads
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    storage.keti.io/workload-type: preprocessing
    storage.keti.io/data-role: cache
    storage.keti.io/access-pattern: repeated
    storage.keti.io/latency: ultra-low
spec:
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cifar10-result-log-pvc
  namespace: ai-storage-workloads
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    storage.keti.io/workload-type: archive
    storage.keti.io/data-role: result-backup
    storage.keti.io/priority: low
spec:
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cifar10-checkpoint-pvc
  namespace: ai-storage-workloads
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    storage.keti.io/workload-type: training
    storage.keti.io/data-role: intermediate
    storage.keti.io/priority: medium
    storage.keti.io/io-pattern: large-write
spec:
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 4Gi}}
