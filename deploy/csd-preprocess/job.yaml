apiVersion: batch/v1
kind: Job
metadata:
  name: csd-preprocess
  namespace: ai-storage-workloads
  labels:
    # CSD-lane workload. The nodeSelector below forces csd-flavor admission
    # (default-flavor is rejected on node-affinity), so this lands on the CSD node.
    kueue.x-k8s.io/queue-name: ai-storage-queue
  annotations:
    # Replace+Force so each new commit re-runs the job (spec.template is immutable).
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app: csd-preprocess
    spec:
      restartPolicy: Never
      nodeSelector:
        csd.enabled: "true"
      containers:
        - name: preprocess
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "echo 'csd-lane: preprocessing dataset on CSD node'; sleep 20; echo done"
          resources:
            requests: {cpu: "500m", memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
