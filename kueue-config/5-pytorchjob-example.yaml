# =============================================================================
# PyTorchJob + Kueue + AI Storage Scheduler 통합 예제
# =============================================================================
# PyTorchJob은 Kueue가 기본 지원합니다.
# Argo Workflow 대신 PyTorchJob을 사용하면 Kueue 큐잉이 자동 적용됩니다.
# =============================================================================

apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: llama-training-job
  namespace: kubeflow-user-example-com
  labels:
    # ─────────────────────────────────────────────────────────────────────────
    # Kueue 연동: 이 레이블만 추가하면 Kueue가 관리
    # ─────────────────────────────────────────────────────────────────────────
    kueue.x-k8s.io/queue-name: ai-storage-queue
spec:
  pytorchReplicaSpecs:
    # ─────────────────────────────────────────────────────────────────────────
    # Master: 학습 조정 노드 (1개)
    # ─────────────────────────────────────────────────────────────────────────
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        metadata:
          annotations:
            # AI Storage Scheduler용 어노테이션
            ai-storage.keti/preprocessing-type: "tokenization"
            ai-storage.keti/io-pattern: "read-heavy"
        spec:
          # AI Storage Scheduler 사용
          schedulerName: ai-storage-scheduler
          containers:
          - name: pytorch
            image: pytorch/pytorch:2.0.0-cuda11.7-cudnn8-runtime
            command:
            - python
            - -c
            - |
              import torch
              import torch.distributed as dist
              import os

              print("=" * 50)
              print("LLaMA Training Job - Master Node")
              print("=" * 50)
              print(f"PyTorch Version: {torch.__version__}")
              print(f"CUDA Available: {torch.cuda.is_available()}")
              print(f"Hostname: {os.uname().nodename}")

              # 시뮬레이션: 실제 학습 대신 데모
              print("\nSimulating training for 30 seconds...")
              import time
              for epoch in range(3):
                  print(f"Epoch {epoch+1}/3 - Training...")
                  time.sleep(10)

              print("\nTraining completed successfully!")
              print("=" * 50)
            resources:
              requests:
                cpu: "500m"
                memory: "1Gi"
              limits:
                cpu: "1"
                memory: "2Gi"

    # ─────────────────────────────────────────────────────────────────────────
    # Worker: 분산 학습 워커 노드 (선택적)
    # ─────────────────────────────────────────────────────────────────────────
    # Worker:
    #   replicas: 2
    #   restartPolicy: OnFailure
    #   template:
    #     spec:
    #       schedulerName: ai-storage-scheduler
    #       containers:
    #       - name: pytorch
    #         image: pytorch/pytorch:2.0.0-cuda11.7-cudnn8-runtime
    #         ...
