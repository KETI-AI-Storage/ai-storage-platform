apiVersion: v1
kind: Pod
metadata:
  name: test-reward-debug-verify
  namespace: default
  labels:
    app: test-reward-debug
spec:
  schedulerName: ai-storage-scheduler
  restartPolicy: Never
  containers:
  - name: nginx
    image: nginx:alpine
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
