      labels:
        gang-group: demo-training
        role: worker
    spec:
      schedulerName: ai-storage-scheduler
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:latest
        command: ["sh", "-c"]
        args:
        - |
          echo "=========================================="
          echo "GANG DEMO - WORKER 1"
          echo "=========================================="
          echo "Node: $(cat /etc/hostname)"
          echo "Started at: $(date)"
          echo ""
          for i in 1 2 3 4 5; do
            echo "[Worker-1] Processing batch $i/5..."
            sleep 3
          done
          echo "Worker-1 complete!"
          echo "=========================================="
        resources:
          requests:
            cpu: "300m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
  backoffLimit: 2
